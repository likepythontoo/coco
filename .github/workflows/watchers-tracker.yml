name: Watchers Growth Tracker
on:
  schedule:
    - cron: "0 0 * * *"  # 每天北京时间8点自动采集数据
  workflow_dispatch:      # 允许手动触发

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Get current watchers count
        id: get-count
        run: |
          COUNT=$(curl -s https://api.github.com/repos/likepythontoo/coco | jq -r '.subscribers_count')
          DATE=$(date +"%Y-%m-%d")
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Update data file
        run: |
          # 初始化数据文件（第一次运行）
          if [ ! -f watchers-data.csv ]; then
            echo "date,count" > watchers-data.csv
          fi
          # 追加今天的数据
          echo "${{ steps.get-count.outputs.date }},${{ steps.get-count.outputs.count }}" >> watchers-data.csv

      - name: Generate SVG curve
        uses: "andstor/chart-action@v1.1.0"
        with:
          input: "watchers-data.csv"
          output: "watchers-growth.svg"
          title: "Watchers Growth Curve"
          theme: "light"
          line-color: "#64748b"
          background-color: "#ffffff"

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watchers-data.csv watchers-growth.svg
          git commit -m "Update watchers growth data"
          git push